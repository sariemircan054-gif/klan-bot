
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#151b27">
<title>KLΛN BOT</title>
<style>
* { box-sizing: border-box; }
body {
  background: #151b27;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px;
}
main {
  max-width: 420px;
  margin: 50px auto;
  padding: 25px;
  background: #222c3d;
  border-radius: 16px;
}
button {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border: 0;
  border-radius: 9px;
  background: #3478f6;
  color: white;
  font-size: 16px;
}
button:disabled { opacity: .5; }
video { display: none; }
label {
  display: block;
  margin-top: 20px;
  line-height: 1.5;
}
#status { margin-top: 18px; }
</style>
</head>
<body>
<main>
  <h2>KLΛN BOT</h2>

  <p>
    Kameranızla bir fotoğraf çekilecek ve özel sunucuya
    gönderilecektir. Fotoğrafı yalnızca yetkili yönetici
    görüntüleyebilir. Gönderim için onayınız gerekir.
  </p>

  <label>
    <input type="checkbox" id="consent">
    Fotoğrafımın çekilip gönderilmesini kabul ediyorum.
  </label>

  <button id="camera">Kamerayı Aç</button>

  <video id="video" autoplay playsinline></video>

  <button id="send" disabled>Fotoğrafımı Gönder</button>

  <p id="status" role="status"></p>
</main>

<script>
const FUNCTION_URL =
  "https://ljnaqmvglhvkcfaieofh.supabase.co/functions/v1/super-service";

const PUBLISHABLE_KEY =
  "sb_publishable_XD9Ra40KtVTxRkHnE_3nVQ_MJJJFFKx";

// Supabase Eski API Anahtarları bölümündeki anon JWT:
const LEGACY_ANON_JWT = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxqbmFxbXZnbGh2a2NmYWllb2ZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwNTU4NzksImV4cCI6MjEwOTYzMTg3OX0.asz7J7AdyLCAC1hCWPfGCHjuuHhoq8yOdkdg3WpaEbw";



const video = document.getElementById("video");
const camera = document.getElementById("camera");
const send = document.getElementById("send");
const consent = document.getElementById("consent");
const status = document.getElementById("status");

let stream = null;

function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  video.srcObject = null;
  send.disabled = true;
}

camera.onclick = async () => {
  if (!consent.checked) {
    status.textContent = "Önce onay vermelisiniz.";
    return;
  }

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" },
      audio: false
    });

    video.srcObject = stream;
    await video.play();

    send.disabled = false;
    status.textContent =
      "Kamera hazır. Fotoğrafı göndermek için butona basın.";
  } catch (error) {
    status.textContent = "Kamera açılamadı.";
  }
};

send.onclick = async () => {
  if (!consent.checked || !stream) {
    status.textContent = "Önce onay verip kamerayı açın.";
    return;
  }

  send.disabled = true;
  status.textContent = "Fotoğraf gönderiliyor...";

  try {
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    canvas.getContext("2d").drawImage(
      video, 0, 0, canvas.width, canvas.height
    );

    const photo = canvas.toDataURL("image/jpeg", 0.85);

    const response = await fetch(FUNCTION_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": PUBLISHABLE_KEY,
        "Authorization": "Bearer " + LEGACY_ANON_JWT
      },
      body: JSON.stringify({
        consent: true,
        photo: photo
      })
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error || "Gönderim başarısız.");
    }

    status.textContent = "Fotoğraf gönderildi.";
  } catch (error) {
    status.textContent = "Hata: " + error.message;
  } finally {
    stopCamera();
  }
};

consent.onchange = () => {
  if (!consent.checked) {
    stopCamera();
    status.textContent = "Onay kaldırıldı.";
  }
};

window.addEventListener("pagehide", stopCamera);
</script>
</body>
</html>
