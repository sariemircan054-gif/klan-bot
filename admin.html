
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klan Bot Yönetici</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#151b27;color:white;font-family:Arial;padding:20px}
main{max-width:500px;margin:auto}
input,button{width:100%;padding:13px;margin:8px 0;box-sizing:border-box;border-radius:8px}
input{border:1px solid #555;background:#222;color:white}
button{background:#2878ff;color:white;border:0;font-weight:bold}
img{width:100%;border-radius:10px;margin-top:10px}
.photo{background:#222;padding:12px;margin:15px 0;border-radius:10px}
#gallery,#recovery{display:none}
</style>
</head>
<body>
<main>
<h2>Klan Bot Yönetici</h2>

<div id="login">
<input id="email" type="email" placeholder="Yönetici e-postası">
<input id="password" type="password" placeholder="Şifre">
<button id="loginBtn">GİRİŞ YAP</button>
</div>

<div id="recovery">
<h3>Yeni şifre belirle</h3>
<input id="newPassword" type="password" placeholder="Yeni şifre">
<button id="savePassword">ŞİFREYİ KAYDET</button>
</div>

<div id="gallery">
<h3>Gönderilen fotoğraflar</h3>
<button id="refresh">FOTOĞRAFLARI YENİLE</button>
<button id="logout">ÇIKIŞ YAP</button>
<div id="photos"></div>
</div>

<p id="message"></p>
</main>

<script>
const SUPABASE_URL = "https://ljnaqmvglhvkcfaieofh.supabase.co";
const SUPABASE_KEY = "sb_publishable_XD9Ra40KtVTxRkHnE_3nVQ_MJJJFFKx";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);

function show(id) {
  $("login").style.display = id === "login" ? "block" : "none";
  $("recovery").style.display = id === "recovery" ? "block" : "none";
  $("gallery").style.display = id === "gallery" ? "block" : "none";
}

function msg(text) {
  $("message").textContent = text;
}

async function loadPhotos() {
  $("photos").innerHTML = "Fotoğraflar yükleniyor...";
  const { data, error } = await db.storage.from("foto-inbox")
    .list("", { limit: 100, sortBy: { column: "created_at", order: "desc" } });

  if (error) {
    $("photos").textContent = "Fotoğraflar yüklenemedi: " + error.message;
    return;
  }

  $("photos").innerHTML = "";
  if (!data || data.length === 0) {
    $("photos").textContent = "Henüz fotoğraf bulunamadı.";
    return;
  }

  for (const file of data) {
    if (!file.name || file.name === ".emptyFolderPlaceholder") continue;
    const { data: signed, error: urlError } = await db.storage
      .from("foto-inbox").createSignedUrl(file.name, 300);
    if (urlError) continue;

    const card = document.createElement("div");
    card.className = "photo";
    const img = document.createElement("img");
    img.src = signed.signedUrl;

    const download = document.createElement("a");
    download.href = signed.signedUrl;
    download.download = file.name;
    download.textContent = "GALERİYE KAYDET";
    download.style.color = "white";
    download.style.display = "block";
    download.style.padding = "12px";

    card.appendChild(img);
    card.appendChild(download);
    $("photos").appendChild(card);
  }
}

$("loginBtn").onclick = async () => {
  msg("Giriş yapılıyor...");
  const { error } = await db.auth.signInWithPassword({
    email: $("email").value,
    password: $("password").value
  });
  if (error) {
    msg("Giriş başarısız: " + error.message);
    return;
  }
  show("gallery");
  msg("Giriş başarılı.");
  loadPhotos();
};

$("savePassword").onclick = async () => {
  const password = $("newPassword").value;
  if (password.length < 8) {
    msg("Şifre en az 8 karakter olmalı.");
    return;
  }
  const { error } = await db.auth.updateUser({ password });
  if (error) {
    msg("Şifre değiştirilemedi: " + error.message);
    return;
  }
  msg("Şifre değiştirildi. Yeni şifrenle giriş yapabilirsin.");
  show("login");
};

$("refresh").onclick = loadPhotos;
$("logout").onclick = async () => {
  await db.auth.signOut();
  show("login");
  msg("Çıkış yapıldı.");
};

db.auth.onAuthStateChange((event, session) => {
  if (event === "PASSWORD_RECOVERY") {
    show("recovery");
    msg("Yeni şifreni belirleyebilirsin.");
  } else if (event === "SIGNED_IN" && session) {
    show("gallery");
    loadPhotos();
  }
});

(async () => {
  const recoveryLink = new URLSearchParams(location.hash.slice(1)).get("type") === "recovery";
  if (recoveryLink) {
    show("recovery");
    return;
  }
  const { data } = await db.auth.getSession();
  if (data.session) {
    show("gallery");
    loadPhotos();
  }
})();
</script>
</body>
</html>
